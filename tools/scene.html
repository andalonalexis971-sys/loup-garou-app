<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
/* Fond d'accueil Loup-Garou : nuit, lune gibbeuse, ravin + loup hurlant, village illuminé dans une vallée de sapins.
   Paramètres : #largeur,hauteur  (portrait ou paysage) */
window.DONE = false;
const [W, H] = location.hash.slice(1).split(',').map(Number);
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const x = cv.getContext('2d');
const P = W < H;                       // portrait ?
const U = Math.min(W, H) / 1000;       // unité
let seed = 1337; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const lerp = (a, b, t) => a + (b - a) * t;

/* Mise en page */
const L = P ? {
  horizon: .66, moonX: .68, moonY: .31, moonR: .16 * W,
  cliffTopY: .70, cliffEdgeX: .42, wolfX: .25, villageX: .72, villageY: .80, villageW: .5
} : {
  horizon: .64, moonX: .74, moonY: .24, moonR: .085 * W,
  cliffTopY: .66, cliffEdgeX: .30, wolfX: .215, villageX: .62, villageY: .80, villageW: .30
};

/* 1. Ciel */
let g = x.createLinearGradient(0, 0, 0, H);
g.addColorStop(0, '#03050b'); g.addColorStop(.35, '#08101f'); g.addColorStop(.62, '#13233a'); g.addColorStop(.75, '#1b2f45'); g.addColorStop(1, '#0a121c');
x.fillStyle = g; x.fillRect(0, 0, W, H);
const mx = L.moonX * W, my = L.moonY * H, mr = L.moonR;
g = x.createRadialGradient(mx, my, mr * .5, mx, my, mr * 7);
g.addColorStop(0, 'rgba(170,200,230,.30)'); g.addColorStop(.35, 'rgba(90,130,170,.12)'); g.addColorStop(1, 'rgba(40,60,90,0)');
x.fillStyle = g; x.fillRect(0, 0, W, H);

/* 2. Voie lactée diffuse + étoiles */
x.save(); x.filter = `blur(${36 * U}px)`; x.globalAlpha = .075;
for (let i = 0; i < 260; i++) {
  const t = rnd(), px = lerp(-.1 * W, 1.1 * W, t), py = lerp(.02 * H, .45 * H, 1 - t) + (rnd() - .5) * .12 * H;
  x.fillStyle = rnd() < .5 ? '#8fa6c8' : '#a9a3c4'; x.beginPath(); x.arc(px, py, (20 + rnd() * 60) * U, 0, 7); x.fill();
}
x.restore();
for (let i = 0; i < (P ? 2200 : 2600); i++) {
  const sx = rnd() * W, sy = Math.pow(rnd(), 1.35) * L.horizon * H;
  const fade = 1 - sy / (L.horizon * H);
  const dm = Math.hypot(sx - mx, sy - my) / mr;
  if (dm < 1.15) continue;
  const big = rnd() < .03;
  const r = (big ? 1.6 + rnd() * 1.6 : .4 + rnd() * 1.1) * U * 1.6;
  x.globalAlpha = Math.min(1, (.25 + rnd() * .75) * (.35 + fade * .65) * Math.min(1, dm / 3));
  x.fillStyle = rnd() < .15 ? '#ffe9c4' : rnd() < .2 ? '#cfe0ff' : '#fbf6ec';
  x.beginPath(); x.arc(sx, sy, r, 0, 7); x.fill();
  if (big) {
    x.globalAlpha *= .5; x.strokeStyle = x.fillStyle; x.lineWidth = .6 * U;
    x.beginPath(); x.moveTo(sx - r * 5, sy); x.lineTo(sx + r * 5, sy); x.moveTo(sx, sy - r * 5); x.lineTo(sx, sy + r * 5); x.stroke();
  }
}
x.globalAlpha = 1;

/* 3. Lune gibbeuse */
g = x.createRadialGradient(mx, my, mr, mx, my, mr * 2.4);
g.addColorStop(0, 'rgba(235,240,255,.35)'); g.addColorStop(1, 'rgba(235,240,255,0)');
x.fillStyle = g; x.beginPath(); x.arc(mx, my, mr * 2.4, 0, 7); x.fill();
x.save(); x.beginPath(); x.arc(mx, my, mr, 0, 7); x.clip();
g = x.createRadialGradient(mx - mr * .3, my - mr * .3, mr * .1, mx, my, mr * 1.05);
g.addColorStop(0, '#fffdf2'); g.addColorStop(.65, '#ece6cf'); g.addColorStop(1, '#c8c2a6');
x.fillStyle = g; x.fillRect(mx - mr, my - mr, mr * 2, mr * 2);
x.filter = `blur(${mr * .035}px)`;
seed = 2024;
[[.05, -.35, .30, .16], [.32, .05, .22, .14], [-.1, .3, .18, .12], [.38, -.38, .1, .1]].forEach(([dx, dy, r, a]) => { x.fillStyle = `rgba(150,148,128,${a})`; x.beginPath(); x.ellipse(mx + dx * mr, my + dy * mr, r * mr, r * mr * .8, rnd(), 0, 7); x.fill(); });
for (let i = 0; i < 40; i++) { const a = rnd() * 7, d = Math.sqrt(rnd()) * .9; x.fillStyle = `rgba(140,136,118,${.06 + rnd() * .08})`; x.beginPath(); x.arc(mx + Math.cos(a) * d * mr, my + Math.sin(a) * d * mr, (.015 + rnd() * .05) * mr, 0, 7); x.fill(); }
x.filter = `blur(${mr * .3}px)`; x.fillStyle = 'rgba(10,16,30,.78)';
x.beginPath(); x.arc(mx - mr * 1.75, my - mr * .05, mr * 1.1, 0, 7); x.fill();      // terminateur doux → gibbeuse
x.restore();

/* 4. Nuages fins éclairés */
x.save(); x.filter = `blur(${14 * U}px)`;
for (let i = 0; i < 26; i++) {
  const cy = my + (rnd() - .2) * mr * 3.2, cx = mx + (rnd() - .5) * mr * 7, near = Math.max(0, 1 - Math.hypot(cx - mx, cy - my) / (mr * 5));
  x.fillStyle = `rgba(${170 + near * 60},${185 + near * 50},${210 + near * 30},${.04 + near * .1})`;
  x.beginPath(); x.ellipse(cx, cy, (120 + rnd() * 260) * U, (8 + rnd() * 18) * U, (rnd() - .5) * .15, 0, 7); x.fill();
}
x.restore();

/* Crête procédurale (déplacement de point milieu) */
function ridge(y0, amp, rough, s) {
  seed = s; let pts = [[0, y0], [W, y0 + (rnd() - .5) * amp]];
  let a = amp;
  for (let k = 0; k < 9; k++) {
    const np = [];
    for (let i = 0; i < pts.length - 1; i++) { const [x1, y1] = pts[i], [x2, y2] = pts[i + 1]; np.push(pts[i], [(x1 + x2) / 2, (y1 + y2) / 2 + (rnd() - .5) * a]); }
    np.push(pts[pts.length - 1]); pts = np; a *= rough;
  }
  return pts;
}
function fillRidge(pts, color) { x.fillStyle = color; x.beginPath(); x.moveTo(0, H); pts.forEach(([a, b]) => x.lineTo(a, b)); x.lineTo(W, H); x.fill(); }
function fog(y, h, a, color = '160,185,215') {
  const gg = x.createLinearGradient(0, y - h, 0, y + h);
  gg.addColorStop(0, `rgba(${color},0)`); gg.addColorStop(.5, `rgba(${color},${a})`); gg.addColorStop(1, `rgba(${color},0)`);
  x.fillStyle = gg; x.fillRect(0, y - h, W, h * 2);
}
function fir(cx, base, h, color) {
  const w = h * (.30 + rnd() * .08); x.fillStyle = color; x.beginPath(); x.moveTo(cx, base - h);
  const tiers = 6;
  for (let t = 1; t <= tiers; t++) { const yy = base - h + h * t / tiers, ww = w * (t / tiers) * (1 + (rnd() - .5) * .25); x.lineTo(cx + ww, yy); x.lineTo(cx + ww * .4, yy - h * .025); }
  x.lineTo(cx + w * .08, base); x.lineTo(cx - w * .08, base);
  for (let t = tiers; t >= 1; t--) { const yy = base - h + h * t / tiers, ww = w * (t / tiers) * (1 + (rnd() - .5) * .25); x.lineTo(cx - ww * .4, yy - h * .025); x.lineTo(cx - ww, yy); }
  x.closePath(); x.fill();
}
const hz = L.horizon * H;

/* 5. Montagnes en profondeur + brume */
fillRidge(ridge(hz - 150 * U, 260 * U, .55, 11), '#1a2b40');
fog(hz - 40 * U, 120 * U, .16);
fillRidge(ridge(hz - 50 * U, 180 * U, .55, 23), '#13213a');
fog(hz + 30 * U, 90 * U, .14);
const valley = ridge(hz + 70 * U, 90 * U, .5, 37);
fillRidge(valley, '#0e192b');

/* 6. Forêt lointaine sur la vallée */
seed = 99;
for (let i = 0; i < 520; i++) {
  const fx = rnd() * W, idx = Math.floor(fx / W * (valley.length - 1)), by = valley[idx][1] + rnd() * 60 * U;
  fir(fx, by + 10 * U, (22 + rnd() * 30) * U, `rgb(${10 + rnd() * 6},${19 + rnd() * 6},${32 + rnd() * 8})`);
}
fog(L.villageY * H - 20 * U, 70 * U, .12);

/* 7. Village illuminé */
const VS = P ? 1.55 : 1; const vx = L.villageX * W, vy = L.villageY * H, vw = L.villageW * W / VS;
x.save(); x.translate(vx, vy); x.scale(VS, VS); x.translate(-vx, -vy);
g = x.createRadialGradient(vx, vy - 20 * U, 10, vx, vy - 20 * U, vw * .75);
g.addColorStop(0, 'rgba(255,170,80,.42)'); g.addColorStop(.4, 'rgba(255,140,60,.14)'); g.addColorStop(1, 'rgba(255,140,60,0)');
x.fillStyle = g; x.fillRect(vx - vw, vy - vw, vw * 2, vw * 2);
seed = 501;
const windows = [];
const houses = [];
for (let i = 0; i < 16; i++) {
  const hx = vx + (rnd() - .5) * vw, hw = (26 + rnd() * 28) * U, hh = (18 + rnd() * 22) * U, base = vy + (rnd() - .2) * 34 * U + Math.abs(hx - vx) / vw * 30 * U;
  houses.push([hx, hw, hh, base]);
}
houses.sort((a, b) => a[3] - b[3]);
const spire = [vx + vw * .06, vy - 6 * U];
houses.forEach(([hx, hw, hh, base]) => {
  x.fillStyle = '#070b14';
  x.fillRect(hx - hw / 2, base - hh, hw, hh);
  x.beginPath(); x.moveTo(hx - hw / 2 - 4 * U, base - hh); x.lineTo(hx, base - hh - hw * .5); x.lineTo(hx + hw / 2 + 4 * U, base - hh); x.fill();
  if (rnd() < .6) x.fillRect(hx + hw * .18, base - hh - hw * .42, 5 * U, hw * .25);
  const n = 1 + Math.floor(rnd() * 3);
  for (let k = 0; k < n; k++) if (rnd() < .8) windows.push([hx - hw / 2 + hw * (k + .5) / n - 2.5 * U, base - hh * .62, 5 * U, 6.5 * U]);
});
// église + clocher
x.fillStyle = '#060a12';
x.fillRect(spire[0] - 16 * U, spire[1] - 40 * U, 32 * U, 46 * U);
x.fillRect(spire[0] - 9 * U, spire[1] - 92 * U, 18 * U, 54 * U);
x.beginPath(); x.moveTo(spire[0] - 12 * U, spire[1] - 92 * U); x.lineTo(spire[0], spire[1] - 150 * U); x.lineTo(spire[0] + 12 * U, spire[1] - 92 * U); x.fill();
x.fillRect(spire[0] - .8 * U, spire[1] - 168 * U, 1.6 * U, 20 * U); x.fillRect(spire[0] - 5 * U, spire[1] - 162 * U, 10 * U, 1.6 * U);
windows.push([spire[0] - 3 * U, spire[1] - 80 * U, 6 * U, 11 * U]);
// fenêtres + halo
x.save(); x.filter = `blur(${5 * U}px)`; x.fillStyle = 'rgba(255,175,80,.9)';
windows.forEach(([a, b, c, d]) => x.fillRect(a - 2 * U, b - 2 * U, c + 4 * U, d + 4 * U)); x.restore();
x.fillStyle = '#ffd38a'; windows.forEach(([a, b, c, d]) => x.fillRect(a, b, c, d));
// fumées de cheminée
x.save(); x.filter = `blur(${7 * U}px)`;
houses.slice(-6).forEach(([hx, hw, hh, base]) => { for (let k = 0; k < 6; k++) { x.fillStyle = `rgba(150,165,190,${.05 - k * .006})`; x.beginPath(); x.ellipse(hx + hw * .2 + k * 6 * U, base - hh - hw * .45 - k * 16 * U, (8 + k * 4) * U, (6 + k * 2) * U, 0, 0, 7); x.fill(); } });
x.restore();
x.restore();

/* 8. Sapins de premier plan autour du village */
seed = 777;
for (let i = 0; i < 70; i++) {
  const fx = vx + (rnd() - .5) * vw * 2.2, d = Math.abs(fx - vx) / vw;
  if (d < .45) continue;
  fir(fx, vy + (40 + rnd() * 80) * U, (70 + rnd() * 90) * U * (.8 + d * .5), `rgb(${6 + rnd() * 4},${11 + rnd() * 4},${20 + rnd() * 6})`);
}
fog(vy + 60 * U, 60 * U, .1);

/* 9. Ravin et falaise de premier plan (gauche) avec le loup */
const ct = L.cliffTopY * H, ce = L.cliffEdgeX * W;
x.fillStyle = '#04070c';
x.beginPath(); x.moveTo(0, ct + 20 * U);
for (let i = 0; i <= 20; i++) { const t = i / 20; x.lineTo(t * ce, ct + Math.sin(t * 7) * 6 * U + (1 - t) * 20 * U - t * 8 * U); }
x.quadraticCurveTo(ce + 20 * U, ct - 6 * U, ce + 26 * U, ct + 22 * U);
x.lineTo(ce + 20 * U, ct + 60 * U); x.lineTo(ce + 30 * U, ct + 95 * U); x.lineTo(ce + 50 * U, ct + 160 * U); x.lineTo(ce + 40 * U, ct + 240 * U);
x.lineTo(ce + 80 * U, H); x.lineTo(0, H); x.closePath(); x.fill();
// liseré lunaire sur l'arête
x.strokeStyle = 'rgba(160,190,220,.35)'; x.lineWidth = 2 * U; x.beginPath(); x.moveTo(ce * .6, ct - 6 * U); x.quadraticCurveTo(ce + 20 * U, ct - 6 * U, ce + 26 * U, ct + 22 * U); x.stroke();
// sapins sur la falaise
seed = 4242;
for (let i = 0; i < 9; i++) fir(rnd() * ce * .55, ct + 30 * U, (110 + rnd() * 140) * U, '#03050a');

/* Loup assis qui hurle (repère 0..100) */
const WOLF = new Path2D('M54.15 0.00 L53.48 0.10 L52.81 0.95 L50.52 6.29 L49.00 9.25 L48.33 9.72 L47.38 9.91 L46.33 10.39 L44.80 11.92 L42.14 17.25 L41.37 18.30 L39.47 20.21 L40.42 20.50 L37.18 23.45 L33.75 26.12 L33.65 26.50 L33.84 26.88 L35.56 27.74 L36.61 27.93 L39.08 27.93 L40.04 27.74 L40.51 27.84 L39.47 29.93 L37.37 32.60 L37.94 32.60 L38.89 32.32 L39.08 32.41 L38.61 33.37 L36.32 36.51 L37.46 36.32 L37.85 36.42 L35.65 39.37 L35.37 39.94 L36.32 39.56 L36.51 39.75 L34.70 42.33 L36.32 41.66 L36.61 41.75 L35.37 43.76 L34.22 45.09 L31.65 47.28 L31.74 47.47 L32.70 47.57 L32.79 47.86 L26.69 54.15 L24.21 57.10 L22.02 60.06 L19.07 64.82 L16.68 69.78 L14.97 74.93 L14.39 77.50 L14.01 80.27 L13.92 83.41 L14.11 85.70 L14.59 88.08 L15.44 90.47 L15.35 90.66 L13.54 89.51 L11.82 87.80 L10.68 86.08 L9.44 83.03 L9.06 80.93 L9.06 76.84 L8.39 77.88 L8.29 76.84 L9.72 70.16 L7.53 72.16 L6.48 73.69 L6.29 73.59 L6.20 72.07 L5.62 72.64 L4.10 75.12 L3.15 77.98 L2.96 77.69 L2.76 76.45 L2.48 77.03 L1.81 79.60 L1.72 82.27 L1.53 82.27 L1.05 81.22 L0.76 80.93 L0.57 82.46 L0.76 85.99 L1.14 87.61 L1.81 89.23 L1.72 89.32 L0.00 87.99 L0.48 89.90 L1.14 91.33 L1.91 92.47 L4.00 94.66 L3.81 94.76 L2.76 94.47 L2.38 94.57 L3.62 95.81 L4.67 96.57 L6.20 97.33 L7.53 97.71 L7.91 98.00 L7.53 98.19 L6.29 98.28 L6.48 98.57 L9.53 99.43 L13.25 99.43 L13.73 99.62 L13.54 100.00 L14.01 100.00 L16.78 99.33 L18.11 98.67 L19.26 97.81 L19.54 97.81 L20.31 98.76 L21.83 99.33 L23.55 99.33 L26.02 98.67 L26.98 99.62 L27.84 99.81 L41.94 99.90 L41.94 98.76 L42.14 98.57 L42.61 99.71 L43.28 99.81 L43.85 99.52 L43.85 98.28 L43.66 97.81 L43.09 97.14 L43.18 96.95 L43.85 97.52 L44.52 98.57 L46.04 98.47 L46.33 98.19 L46.33 97.33 L45.95 96.19 L44.71 94.76 L43.95 94.38 L42.99 94.18 L41.47 94.18 L36.42 94.66 L35.65 94.57 L38.70 91.52 L40.90 88.56 L42.42 85.41 L43.09 82.55 L43.09 79.98 L42.90 78.93 L42.04 76.74 L40.61 74.83 L38.99 73.59 L36.89 72.74 L35.75 72.55 L33.37 72.55 L33.46 72.35 L34.32 72.16 L36.99 72.16 L38.13 72.45 L39.56 73.12 L40.51 73.78 L42.14 75.50 L42.90 76.74 L43.66 78.74 L43.95 81.03 L44.61 79.69 L45.28 80.55 L45.57 78.93 L46.14 77.41 L46.33 77.22 L46.62 78.55 L47.86 76.07 L48.24 75.69 L48.33 75.79 L48.43 76.84 L48.90 76.84 L51.10 85.80 L51.57 88.56 L51.76 91.52 L52.81 93.52 L53.67 96.85 L54.05 97.71 L54.62 98.38 L55.29 98.67 L59.01 98.57 L60.06 99.71 L61.87 100.00 L63.58 100.00 L64.63 99.71 L64.63 98.28 L65.01 98.76 L65.30 99.81 L66.63 99.62 L66.63 97.81 L67.21 98.67 L67.30 99.24 L67.78 99.24 L67.87 97.90 L67.68 97.04 L67.21 96.19 L66.73 95.71 L65.87 95.33 L63.58 95.04 L63.01 94.57 L62.15 93.14 L61.58 91.42 L61.01 88.47 L60.44 82.65 L60.15 75.41 L60.06 66.54 L61.68 62.06 L62.35 63.11 L63.97 56.53 L64.25 56.82 L64.44 57.86 L64.63 57.67 L65.11 55.39 L65.11 53.77 L64.92 52.53 L65.11 52.43 L65.97 53.19 L66.44 53.38 L65.97 51.00 L65.97 48.90 L65.68 47.09 L65.78 47.00 L66.25 47.47 L66.63 48.14 L66.73 46.71 L66.16 44.42 L65.01 42.04 L65.11 41.94 L66.35 42.61 L67.11 42.80 L66.54 41.66 L65.40 38.42 L65.49 38.04 L66.44 38.89 L66.25 37.37 L65.49 35.56 L64.44 34.03 L64.92 33.94 L65.78 34.13 L65.78 33.94 L63.30 31.27 L63.39 31.08 L65.01 31.17 L63.87 30.12 L62.73 28.69 L62.82 28.50 L63.97 28.69 L62.15 26.41 L61.49 25.26 L61.68 25.17 L62.73 25.36 L61.68 24.21 L60.63 22.50 L60.72 22.21 L61.30 22.40 L61.39 22.31 L60.63 21.07 L60.15 19.45 L60.15 17.35 L60.34 16.59 L62.35 12.30 L62.73 11.15 L62.73 10.01 L62.25 9.06 L61.68 8.39 L61.11 8.67 L60.72 8.67 L60.06 8.29 L59.77 8.29 L60.25 9.25 L60.15 9.53 L58.44 11.06 L58.15 10.87 L58.34 7.53 L58.34 5.15 L58.15 4.39 L57.67 3.53 L56.91 2.76 L55.77 2.38 L55.86 1.72 L55.48 1.05 L54.81 0.38ZM52.53 71.97 L53.10 73.21 L55.48 81.60 L56.53 86.56 L56.72 91.04 L57.77 92.37 L58.34 94.66 L58.25 95.33 L56.91 93.71 L56.24 92.09 L55.86 89.99 L55.39 84.75 L54.24 79.50 L52.43 72.26Z');
const ws = (P ? 2.3 : 1.45) * U, wx = L.wolfX * W, wy = ct - 100 * ws - 3 * U;
x.save(); x.translate(wx, wy); x.scale(ws, ws);
x.fillStyle = 'rgba(175,205,230,.55)'; x.translate(1.2, -.8); x.fill(WOLF, 'evenodd'); x.translate(-1.2, .8);
x.fillStyle = '#04070c'; x.fill(WOLF, 'evenodd');
x.restore();

/* 10. Grand sapins de premier plan (bords) */
seed = 8080;
for (let i = 0; i < 6; i++) fir(W - rnd() * W * .14, H + 20 * U, (380 + rnd() * 260) * U, '#020409');
fir(W * (P ? .93 : .97), H + 40 * U, (P ? 760 : 620) * U, '#020308');

/* 11. Brume basse + vignettage + grain */
x.save(); x.filter = `blur(${40 * U}px)`;
for (let i = 0; i < 18; i++) { x.fillStyle = `rgba(150,175,205,${.035 + rnd() * .04})`; x.beginPath(); x.ellipse(rnd() * W, lerp(.72, .95, rnd()) * H, (200 + rnd() * 400) * U, (30 + rnd() * 40) * U, 0, 0, 7); x.fill(); }
x.restore();
g = x.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .3, W / 2, H * .5, Math.max(W, H) * .8);
g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)');
x.fillStyle = g; x.fillRect(0, 0, W, H);
// voile sombre en haut pour la lisibilité du titre
g = x.createLinearGradient(0, 0, 0, H * .3); g.addColorStop(0, 'rgba(2,3,8,.55)'); g.addColorStop(1, 'rgba(2,3,8,0)');
x.fillStyle = g; x.fillRect(0, 0, W, H * .3);
const img = x.getImageData(0, 0, W, H), d = img.data;
for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 10; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
x.putImageData(img, 0, 0);
window.DONE = true;
</script></body></html>
